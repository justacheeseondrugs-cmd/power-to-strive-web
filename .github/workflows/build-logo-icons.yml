name: Generate app logo icons
on:
  push:
    branches: [main]
    paths:
      - "icons/user-cat-logo.svg"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install "Pillow>=10,<12"
      - name: Generate PNG icons
        run: python scripts/build-logo-icons.py
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/logo-192.png icons/logo-512.png icons/logo-maskable-512.png
          if git diff --cached --quiet; then
            echo "Icons unchanged"
          else
            git commit -m "Generate installed-app PNG icons from owner logo"
            git push
          fi
