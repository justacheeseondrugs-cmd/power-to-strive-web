name: Check English interface
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/check-english-interface.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify every JavaScript file parses
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Verify English interface and preserve local story storage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          page = Path('index.html').read_text()
          app = Path('js/app.js').read_text()
          src = {p.name: p.read_text() for p in Path('js/ui').glob('*.js')}
          manifest = json.loads(Path('manifest.webmanifest').read_text())
          assert '<html lang="en">' in page
          assert 'A little more magic today?' in page
          assert 'Your stories are right where you left them.' in page
          assert all('>'+label+'<' in page for label in ('✒️ Write','📖 Chapters','💗 Characters','📚 Documents','🧠 Memory','⚙️ Settings'))
          assert 'Original story (existing data)' in app
          assert "localStorage.setItem('pts_last_view', name)" in app
          assert "db.get('settings','workspaces')" in app
          assert "const DB_VERSION = 1" in Path('js/db.js').read_text()
          assert manifest['scope'] == './' and manifest['start_url'] == './index.html'
          assert 'Write first block' in src['write.js']
          assert 'Download all as .md' in src['chapters.js']
          assert 'Save settings' in src['settings.js']
          assert 'Your API key is saved ONLY in this browser' in src['settings.js']
          assert 'SOS Ideas' in src['planner.js']
          assert "'en-GB'" in Path('js/utils.js').read_text()
          old_labels = ('>Escribir<','>Capítulos<','>Personajes<','>Documentos<','>Memoria<','>Ajustes<',
                        'Guardar ajustes','Reescribir con IA','Crear/actualizar memoria','Apariencia y lectura',
                        '¿Qué te gustaría planear?','Añadir hecho bloqueado')
          for fragment in old_labels:
            assert fragment not in page
            assert all(fragment not in text for text in src.values()), fragment
          print('PASS: English navigation and workflows; previous IndexedDB version, workspace IDs and URL scope preserved.')
          PY
