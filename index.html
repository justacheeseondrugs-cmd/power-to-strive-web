<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power to Strive Studio</title>
<meta name="theme-color" content="#b56576">
<link rel="manifest" href="manifest.webmanifest?v=20260924-cat-logo-1">
<link rel="icon" href="icons/logo-192.png?v=20260924-cat-logo-1" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/logo-192.png?v=20260924-cat-logo-1">
<link rel="stylesheet" href="css/style.css?v=20260925-planner-v1">
</head>
<body>
<div id="app">

  <header class="app-header">
    <img class="brand-cat" src="icons/logo-192.png?v=20260924-cat-logo-1" alt="Gatito negro leyendo un libro rosa" width="54" height="54">
    <div>
      <div class="brand-title">Power to Strive Studio</div>
      <div class="brand-sub">tu estudio personal de fanfiction largo</div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-view="write">✒️ Escribir</button>
    <button class="tab-btn" data-view="planner">💡 Planificar</button>
    <button class="tab-btn" data-view="chapters">📖 Capítulos</button>
    <button class="tab-btn" data-view="characters">💗 Personajes</button>
    <button class="tab-btn" data-view="documents">📚 Documentos</button>
    <button class="tab-btn" data-view="memory">🧠 Memoria</button>
    <button class="tab-btn" data-view="settings">⚙️ Ajustes</button>
  </nav>

  <div class="workspace-bar" aria-label="Proyecto de escritura"><div class="workspace-bar-inner"><label for="workspace-select">📚 Historia:</label><select id="workspace-select" aria-label="Historia activa"><option value="original">Historia original (mis datos actuales)</option></select><button type="button" id="workspace-create" class="btn btn-ghost btn-sm">+ Nueva historia</button></div><span class="workspace-current" id="workspace-label">Historia original (mis datos actuales)</span></div>

  <main>
    <section id="view-write" class="view"></section>
    <section id="view-chapters" class="view"></section>
    <section id="view-characters" class="view"></section>
    <section id="view-documents" class="view"></section>
    <section id="view-memory" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <footer class="app-footer">Power to Strive Studio · tus datos viven sólo en este navegador (IndexedDB)</footer>
</div>

<script type="module" src="js/app.js?v=20260925-planner-v1"></script>
</body>
</html>
