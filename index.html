<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inky Paws · Where stories bloom softly</title>
<meta name="description" content="Inky Paws — Where stories bloom softly. Your cozy fanfiction writing studio.">
<meta name="theme-color" content="#b56576">
<link rel="manifest" href="manifest.webmanifest?v=20260925-inky-paws-v1">
<link rel="icon" href="icons/logo-192.png?v=20260925-inky-paws-v1" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/logo-192.png?v=20260925-inky-paws-v1">
<link rel="stylesheet" href="css/style.css?v=20260925-english-v1">
</head>
<body>
<div id="app">

  <header class="app-header">
    <img class="brand-cat" src="icons/user-cat-logo.svg?v=20260925-inky-paws-v1" alt="Inky Paws: black kitten reading a pink book with inky paw prints" width="64" height="64">
    <div>
      <div class="brand-title">Inky Paws</div>
      <div class="brand-sub">Where stories bloom softly</div>
    </div>
  </header>

  <div class="welcome-note">
    <div class="welcome-headline">A little more magic today? <span aria-hidden="true">✨</span></div>
    <p class="welcome-subline">Your stories are right where you left them.</p>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-view="write">✒️ Write</button>
    <button class="tab-btn" data-view="planner">🆘 SOS Ideas</button>
    <button class="tab-btn" data-view="chapters">📖 Chapters</button>
    <button class="tab-btn" data-view="characters">💗 Characters</button>
    <button class="tab-btn" data-view="documents">📚 Documents</button>
    <button class="tab-btn" data-view="memory">🧠 Memory</button>
    <button class="tab-btn" data-view="settings">⚙️ Settings</button>
  </nav>

  <div class="workspace-bar" aria-label="Writing project"><div class="workspace-bar-inner"><label for="workspace-select">📚 Story:</label><select id="workspace-select" aria-label="Active story"><option value="original">Original story (existing data)</option></select><button type="button" id="workspace-create" class="btn btn-ghost btn-sm">+ New story</button></div><span class="workspace-current" id="workspace-label">Original story (existing data)</span></div>

  <main>
    <section id="view-write" class="view"></section>
    <section id="view-planner" class="view"></section>
    <section id="view-chapters" class="view"></section>
    <section id="view-characters" class="view"></section>
    <section id="view-documents" class="view"></section>
    <section id="view-memory" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <footer class="app-footer">Inky Paws · your stories are stored locally in this browser (IndexedDB)</footer>
</div>

<script type="module" src="js/app.js?v=20260925-english-v1"></script>
</body>
</html>
